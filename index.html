<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Script Import & Live Search -->
  <script type="module">
    // Sesuaikan path import dengan lokasi file crystalData kamu (misal: './src/crystal-data.js' atau './crystal-data.js')
    import { crystalData } from './crystal-data.js';

    const searchInput = document.getElementById('searchInput');
    const resultContainer = document.getElementById('resultContainer');
    const infoText = document.getElementById('infoText');
    const totalBadge = document.getElementById('totalBadge');

    totalBadge.textContent = `HASIL : ${crystalData.length} XTALL`;

    function renderList(data) {
      resultContainer.innerHTML = '';

      if (data.length === 0) {
        resultContainer.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-sm bg-slate-800/40 rounded-xl border border-slate-700/50">
            Xtall tidak ditemukan. Coba kata kunci lain!
          </div>
        `;
        infoText.textContent = `Ditemukan: 0 Xtall`;
        return;
      }

      infoText.textContent = `Menampilkan ${Math.min(data.length, 50)} dari total ${data.length} Xtall`;

      // Batasi 50 teratas agar performa tetap ringan saat mengetik
      data.slice(0, 50).forEach(item => {
        let badgeColor = "bg-purple-900/60 text-purple-300 border-purple-700";
        if (item.type === "UPGRADE") badgeColor = "bg-amber-900/60 text-amber-300 border-amber-700";
        if (item.type === "ADDITIONAL") badgeColor = "bg-blue-900/60 text-blue-300 border-blue-700";

        const card = document.createElement('div');
        card.className = 'bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm hover:border-purple-500 transition';
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <span class="font-bold text-base text-purple-200 tracking-wide">${item.name}</span>
            <span class="text-[10px] ${badgeColor} px-2.5 py-0.5 rounded-md border font-semibold">${item.type}</span>
          </div>
          <p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed font-mono bg-slate-900/50 p-2.5 rounded-lg border border-slate-800">${item.view}</p>
          <div class="mt-3 text-[10px] text-slate-500 flex justify-between items-center">
            <span>ID: #${item.code}</span>
          </div>
        `;
        resultContainer.appendChild(card);
      });
    }

    // Event pencarian instan
    searchInput.addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase().trim();
      const filtered = crystalData.filter(item =>
        item.name.toLowerCase().includes(keyword) ||
        item.view.toLowerCase().includes(keyword) ||
        item.code.toString().includes(keyword) ||
        item.type.toLowerCase().includes(keyword)
      );
      renderList(filtered);
    });

    // Render awal saat halaman dimuat
    renderList(crystalData);
  </script>
</body>
